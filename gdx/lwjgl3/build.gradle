apply plugin: 'application'

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

application {
  mainClass = 'ohheck.lwjgl3.Lwjgl3Launcher'
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// assets are read from the desktop game's resources folder
def assetsDir = rootProject.file('../resources')

tasks.named('run') {
  workingDir = assetsDir
}

// Plays a scripted game and saves screenshots of key moments (used by CI)
tasks.register('screenshots', JavaExec) {
  mainClass = 'ohheck.lwjgl3.ScreenshotLauncher'
  classpath = sourceSets.main.runtimeClasspath
  workingDir = assetsDir
  args = [rootProject.file('build/screenshots').absolutePath]
}
