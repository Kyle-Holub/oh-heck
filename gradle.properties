org.gradle.daemon=true
# reuse task outputs between builds (CI keeps them in its Gradle cache) and run modules side by side
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xms512M -Xmx2G -Dfile.encoding=UTF-8
gdxVersion=1.14.0
androidPluginVersion=8.7.3
# Build number for dev builds; CI passes -PversionCode=<run number>
versionCode=1
android.useAndroidX=true
