apply plugin: 'com.android.application'

def buildNumber = project.property('versionCode').toInteger()

android {
  namespace 'ohheck.android'
  compileSdk 35

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.setSrcDirs(['src/main/java'])
      res.setSrcDirs(['res'])
      assets.setSrcDirs(['../assets'])
      jniLibs.srcDirs = ['libs']
    }
  }

  defaultConfig {
    // Placeholder ID; dev builds add ".dev" (kept so updates install over the current app)
    applicationId 'io.github.kyleholub.ohheck'
    minSdkVersion 21
    targetSdkVersion 35
    versionCode buildNumber
    // zero-padded so the build names sort in order (dev-0009 < dev-0010)
    versionName String.format('dev-%04d', buildNumber)
  }

  signingConfigs {
    // The key that signs the builds published for Obtainium. It is not in the repo:
    // CI writes it from the OHHECK_KEYSTORE_B64 secret and points OHHECK_KEYSTORE at it.
    published {
      def ks = System.getenv('OHHECK_KEYSTORE')
      if (ks) {
        storeFile file(ks)
        storePassword System.getenv('OHHECK_KEYSTORE_PASSWORD')
        keyAlias 'ohheck'
        keyPassword System.getenv('OHHECK_KEYSTORE_PASSWORD')
      }
    }
  }

  buildTypes {
    debug {
      // local builds only, signed with the machine's own debug key
      applicationIdSuffix '.dev.debug'
      resValue 'string', 'app_name', 'Oh Heck! (debug)'
    }
    release {
      // the build CI publishes: optimised, not debuggable
      applicationIdSuffix '.dev'
      resValue 'string', 'app_name', 'Oh Heck!'
      if (System.getenv('OHHECK_KEYSTORE')) {
        signingConfig signingConfigs.published
      }
      // strip unused library code (most of the app's size otherwise); names kept for readable crash logs
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

configurations { natives }

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
}

// Unpack libGDX's native libraries into libs/<abi>/ so they are packaged in the APK
tasks.register('copyAndroidNatives') {
  doFirst {
    // phones only: the x86 builds are just for emulators
    ['armeabi-v7a', 'arm64-v8a'].each { abi ->
      file("libs/$abi").mkdirs()
    }
    configurations.natives.copy().files.each { jar ->
      def abi = ['armeabi-v7a', 'arm64-v8a'].find { jar.name.endsWith("natives-${it}.jar") }
      if (abi != null) {
        copy {
          from zipTree(jar)
          into file("libs/$abi")
          include '*.so'
        }
      }
    }
  }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
  dependsOn 'copyAndroidNatives'
}
