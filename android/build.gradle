apply plugin: 'com.android.application'

def buildNumber = project.property('versionCode').toInteger()

android {
  namespace 'ohheck.android'
  compileSdk 35

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.setSrcDirs(['src/main/java'])
      res.setSrcDirs(['res'])
      assets.setSrcDirs(['../assets'])
      jniLibs.srcDirs = ['libs']
    }
  }

  defaultConfig {
    // Placeholder ID; dev builds add ".dev" so they install beside a real release
    applicationId 'io.github.kyleholub.ohheck'
    minSdkVersion 21
    targetSdkVersion 35
    versionCode buildNumber
    // zero-padded so the build names sort in order (dev-0009 < dev-0010)
    versionName String.format('dev-%04d', buildNumber)
  }

  signingConfigs {
    // A throwaway key committed to the repo so every dev build installs over the last.
    // Real releases must use a private key kept out of the repo.
    dev {
      storeFile file('dev.keystore')
      storePassword 'ohheckdev'
      keyAlias 'dev'
      keyPassword 'ohheckdev'
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.dev'
      resValue 'string', 'app_name', 'Oh Heck! (dev)'
      signingConfig signingConfigs.dev
    }
    release {
      resValue 'string', 'app_name', 'Oh Heck!'
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

configurations { natives }

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Unpack libGDX's native libraries into libs/<abi>/ so they are packaged in the APK
tasks.register('copyAndroidNatives') {
  doFirst {
    ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
      file("libs/$abi").mkdirs()
    }
    configurations.natives.copy().files.each { jar ->
      def abi = ['armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'].find { jar.name.endsWith("natives-${it}.jar") }
      if (abi != null) {
        copy {
          from zipTree(jar)
          into file("libs/$abi")
          include '*.so'
        }
      }
    }
  }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
  dependsOn 'copyAndroidNatives'
}
