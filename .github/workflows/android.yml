name: Android dev build

# Builds the libGDX Android app on every push to a develop branch and publishes
# the APK as a "dev-N" pre-release, which Obtainium picks up on the phone.

on:
  push:
    branches: ['develop/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-dev-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew core:test android:assembleDebug lwjgl3:dist -PversionCode=${{ github.run_number }} --stacktrace

      - name: Screenshots of a scripted game
        continue-on-error: true
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1600x800x24" ./gradlew lwjgl3:screenshots --stacktrace
          ls -l build/screenshots

      - name: Publish dev build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # zero-padded so alphabetical order is build order (Obtainium and GitHub sort by name)
          TAG="dev-$(printf '%04d' ${{ github.run_number }})"
          APK="oh-heck-${TAG}.apk"
          cp android/build/outputs/apk/debug/android-debug.apk "$APK"
          cp build/dist/oh-heck-desktop.jar oh-heck-desktop.jar
          SHOTS=$(ls build/screenshots/*.png 2>/dev/null || true)
          gh release create "$TAG" "$APK" oh-heck-desktop.jar $SHOTS \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Automatic test build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}): $(git log -1 --pretty=%s)"
          # keep only the three newest dev builds, and drop old unpadded names (dev-9, dev-10)
          gh release list --limit 100 --json tagName --jq '.[].tagName' > tags.txt
          grep -E '^dev-[0-9]{1,3}$' tags.txt | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
          grep -E '^dev-[0-9]{4,}$' tags.txt | sort -r | tail -n +4 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
