name: Preview

# On pushes to refactor/ or feature/ branches: play the scripted game and put
# its screenshots on a draft release (drafts are private, so Obtainium never
# sees them). Nothing is published; merge into a develop/ branch for that.

on:
  push:
    branches: ['refactor/**', 'feature/**']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Play a scripted game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT \
            xvfb-run -a -s "-screen 0 1600x800x24" ./gradlew lwjgl3:screenshots --stacktrace
          ls -l build/screenshots

      - name: Attach screenshots to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${{ github.run_number }}"
          gh release create "$TAG" build/screenshots/*.png --draft --target "$GITHUB_SHA" \
            --title "Preview ${{ github.run_number }} (${GITHUB_REF_NAME})" --notes "$(git log -1 --pretty=%s)"
          # keep only the newest three previews
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
            | grep -E '^preview-[0-9]+$' | sort -t- -k2 -n -r | tail -n +4 \
            | while read -r old; do gh release delete "$old" --yes; done
