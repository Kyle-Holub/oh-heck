name: Arena

# Experiments on the computer players, run by hand only (Actions > Arena > Run workflow).
# Never runs on a push, so it costs the normal builds nothing. See README.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'levels N | vs N | samples N | learn N'
        default: 'levels 200'

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run the arena
        run: |
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew -q core:arena -Parena="${{ inputs.experiment }}" | tee arena.txt
          { echo '### Arena: `${{ inputs.experiment }}`'; echo '```'; cat arena.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach a regenerated bid table
        if: startsWith(inputs.experiment, 'learn')
        uses: actions/upload-artifact@v4
        with:
          name: BidTable
          path: core/src/main/java/ohheck/players/BidTable.java
