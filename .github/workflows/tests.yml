name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Rules tests
        # no Android SDK needed: unset it so only core + desktop are configured
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gdx/gradlew -p gdx :core:test --stacktrace

      - name: Swing desktop game compiles
        run: javac -d build/swing -cp "libraries/*" $(find src -name '*.java')
