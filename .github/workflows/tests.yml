name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Rules tests and desktop build
        # no Android SDK needed: unset it so only core + desktop are configured
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew core:test lwjgl3:dist --stacktrace
