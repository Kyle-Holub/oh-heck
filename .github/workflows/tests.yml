name: Tests

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JUnit
        run: |
          mkdir -p lib
          curl -sSfL -o lib/junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfL -o lib/hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Run rules tests
        run: |
          javac --release 8 -Xlint:-options -d build/rules src/rules/*.java
          javac --release 8 -Xlint:-options -d build/test -cp build/rules:lib/junit.jar:lib/hamcrest.jar test/rules/*.java
          java -cp build/rules:build/test:lib/junit.jar:lib/hamcrest.jar org.junit.runner.JUnitCore rules.RulesTest rules.BotTest rules.MatchTest

      - name: Desktop game compiles
        run: javac -d build/desktop -cp "libraries/*" $(find src -name '*.java')
