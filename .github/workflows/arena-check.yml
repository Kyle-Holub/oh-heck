name: Arena check

# Experiments on the computer players, run by hand only (Actions > Arena > Run workflow).
# Never runs on a push, so it costs the normal builds nothing. See README.

on:
  push:
    branches: [feature/learned-bids]
  workflow_dispatch:
    inputs:
      experiment:
        description: 'levels N | vs N | samples N | learn N'
        default: 'levels 200'

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the arena
        run: |
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew -q core:arena -Parena="vs 40" | tee arena.txt
          { echo '### Arena: `vs 40`'; echo '```'; cat arena.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach a regenerated bid table
        if: startsWith(inputs.experiment, 'learn')
        uses: actions/upload-artifact@v4
        with:
          name: BidTable
          path: core/src/main/java/rules/BidTable.java
