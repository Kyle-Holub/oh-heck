apply plugin: 'application'

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

application {
  mainClass = 'ohheck.lwjgl3.Lwjgl3Launcher'
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

def assetsDir = rootProject.file('assets')

tasks.named('run') {
  workingDir = assetsDir
}

// A single runnable jar with the game, its libraries and assets inside:
// double-click it (or "java -jar oh-heck-desktop.jar") with Java installed.
tasks.register('dist', Jar) {
  archiveFileName = 'oh-heck-desktop.jar'
  destinationDirectory = rootProject.file('build/dist')
  manifest {
    attributes 'Main-Class': application.mainClass.get()
  }
  dependsOn configurations.runtimeClasspath
  from sourceSets.main.output
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  // assets at the jar's root, where Gdx.files.internal() finds them on the classpath
  from assetsDir
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
}

// Plays a scripted game and saves screenshots of key moments (used by CI)
tasks.register('screenshots', JavaExec) {
  mainClass = 'ohheck.lwjgl3.ScreenshotLauncher'
  classpath = sourceSets.main.runtimeClasspath
  workingDir = assetsDir
  args = [rootProject.file('build/screenshots').absolutePath]
}
